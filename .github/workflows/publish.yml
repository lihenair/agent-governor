# Tokenless npm publish with OIDC (trusted publishing) + automatic provenance.
# npmjs.com → agent-governor → Settings → Trusted Publisher must be:
#   Organization or user: lihenair   (GitHub login, not npm username albertli007)
#   Repository:           agent-governor
#   Workflow filename:    publish.yml
#   Environment name:     empty
#   Allowed actions:      npm publish
name: Publish Package

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install -g npm@latest
      - run: npm ci
      - uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('npm:registry.npmjs.org');
            if (!token) throw new Error('OIDC token empty');
            core.setSecret(token);
            core.exportVariable('NPM_ID_TOKEN', token);
      - name: Publish with OIDC
        run: |
          unset NPM_CONFIG_USERCONFIG
          unset NODE_AUTH_TOKEN
          npm publish --access public
        env:
          NPM_CONFIG_PROVENANCE: true
