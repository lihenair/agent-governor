# Tokenless npm publish with OIDC (trusted publishing) + automatic provenance.
# Configure npmjs.com → agent-governor → Settings → Trusted Publisher:
#   Organization or user: lihenair
#   Repository:           agent-governor
#   Workflow filename:    publish.yml   (filename only, not the path)
#   Environment name:     (leave blank — this job has no GitHub Environment)
#   Allowed actions:      npm publish
#
# Then: bump version, merge to main, git tag vX.Y.Z && git push origin vX.Y.Z
name: Publish Package

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      # Trusted publishing needs npm CLI >= 11.5.1
      - run: npm install -g npm@11.5.1
      - run: npm ci
      - run: npm publish --access public
