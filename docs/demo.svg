<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-label="Agent Governor split-screen demo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="960" height="420" fill="url(#bg)"/>
  <text x="480" y="36" text-anchor="middle" fill="#e5e7eb" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">Agent Governor  deterministic interception</text>

  <!-- Left pane -->
  <g filter="url(#shadow)">
    <rect x="28" y="58" width="440" height="330" rx="16" fill="#1f2937" stroke="#ef4444" stroke-width="2"/>
  </g>
  <circle cx="52" cy="80" r="6" fill="#ef4444"/>
  <circle cx="72" cy="80" r="6" fill="#f59e0b"/>
  <circle cx="92" cy="80" r="6" fill="#22c55e"/>
  <text x="118" y="85" fill="#fca5a5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">WITHOUT GUARD</text>
  <text x="48" y="124" fill="#9ca3af" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">$ claude</text>
  <text x="48" y="148" fill="#f87171" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">Edit tsconfig.json</text>
  <text x="48" y="172" fill="#fda4af" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">"strict": false</text>
  <text x="48" y="208" fill="#e5e7eb" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">Agent: type errors gone (</text>
  <text x="48" y="232" fill="#fb7185" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">Reality: the bug is still there.</text>
  <rect x="48" y="258" width="396" height="96" rx="10" fill="#111827"/>
  <text x="64" y="288" fill="#f87171" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700">Config tampering succeeded</text>
  <text x="64" y="312" fill="#d1d5db" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Build/lint/typecheck policy was weakened</text>
  <text x="64" y="332" fill="#9ca3af" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">to hide a source-level TypeScript error.</text>

  <!-- Right pane -->
  <g filter="url(#shadow)">
    <rect x="492" y="58" width="440" height="330" rx="16" fill="#1f2937" stroke="#22c55e" stroke-width="2"/>
  </g>
  <circle cx="516" cy="80" r="6" fill="#ef4444"/>
  <circle cx="536" cy="80" r="6" fill="#f59e0b"/>
  <circle cx="556" cy="80" r="6" fill="#22c55e"/>
  <text x="582" y="85" fill="#86efac" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">WITH AGENT GOVERNOR</text>
  <text x="512" y="124" fill="#9ca3af" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">$ claude</text>
  <text x="512" y="148" fill="#fbbf24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">Edit tsconfig.json</text>
  <text x="512" y="172" fill="#f87171" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">[GOVERNOR BLOCK] exit 2</text>
  <text x="512" y="208" fill="#86efac" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">Agent: I will fix the source instead.</text>
  <text x="512" y="232" fill="#67e8f9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">Edit src/user.ts  ’  types restored</text>
  <rect x="512" y="258" width="396" height="96" rx="10" fill="#052e16"/>
  <text x="528" y="288" fill="#4ade80" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700">Protected config left untouched</text>
  <text x="528" y="312" fill="#d1fae5" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">stderr reason is injected back into the</text>
  <text x="528" y="332" fill="#a7f3d0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">agent loop so it retries on real code.</text>
</svg>
